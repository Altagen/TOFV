name: Release

# Tags are bare versions, no leading "v" — matching the convention the other
# Altagen projects use, which is also what the Ora registry entry expects.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build linux-x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff needs the history, not just the tip

      - name: Resolve version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Before anything is built: the binaries report the Cargo version, so a
      # tag that disagrees with the manifests would publish a binary that lies
      # about which release it is.
      - name: Check the manifests match the tag
        run: ./scripts/check-version.sh '${{ steps.v.outputs.version }}'

      # The runner's third-party apt sources break `apt-get update` whenever
      # one of their mirrors is mid-sync. Ubuntu's own are left alone.
      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            build-essential \
            clang \
            pkg-config

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the frontend
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Build the binaries
        run: cargo build --release --locked --workspace

      # Flat layout so `ora` finds the user binaries without knowing anything
      # about our directory conventions, and install-bin.sh can do the rest.
      - name: Stage the tarball
        id: pack
        run: |
          set -eu
          v='${{ steps.v.outputs.version }}'
          dir="tofv-${v}-linux-x86_64"
          mkdir -p "$dir/icons"
          install -m 755 target/release/tofv-app "$dir/tofv-app"
          install -m 755 target/release/tofv "$dir/tofv"
          install -m 755 target/release/tofv-helper "$dir/tofv-helper"
          install -m 755 target/release/pinentry-tofv "$dir/pinentry-tofv"
          install -m 755 scripts/install-bin.sh "$dir/install-bin.sh"
          install -m 644 packaging/linux/polkit/dev.tofv.policy.in "$dir/dev.tofv.policy.in"
          install -m 644 packaging/linux/dev.tofv.desktop "$dir/dev.tofv.desktop"
          for s in 32 64 128 256 512; do
            install -m 644 "branding/mark-${s}.png" "$dir/icons/mark-${s}.png"
          done
          install -m 644 LICENSE "$dir/LICENSE"
          install -m 644 README.md "$dir/README.md"
          tar czf "${dir}.tar.gz" "$dir"
          echo "archive=${dir}.tar.gz" >> "$GITHUB_OUTPUT"

      # One SBOM covering both ecosystems: syft reads Cargo.lock and
      # package-lock.json in the same pass, so there is nothing to merge and
      # no unverified binary to download in order to merge it.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: tofv-${{ steps.v.outputs.version }}-sbom.json
          upload-artifact: false
          upload-release-assets: false

      # Every published file, one line each, so a download can be verified
      # without trusting the transport.
      - name: Checksums
        run: |
          set -eu
          v='${{ steps.v.outputs.version }}'
          sha256sum "tofv-${v}-linux-x86_64.tar.gz" "tofv-${v}-sbom.json" \
            | tee SHA256SUMS.txt

      - name: Generate the release notes
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          v='${{ steps.v.outputs.version }}'
          # A tag carrying a suffix (0.1.0-rc.1) is a pre-release.
          prerelease=""
          case "$v" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$v" \
            --repo "${{ github.repository }}" \
            --title "TOFV $v" \
            --notes-file CHANGES.md \
            $prerelease \
            "tofv-${v}-linux-x86_64.tar.gz" \
            "tofv-${v}-sbom.json" \
            SHA256SUMS.txt
