name: CodeQL

# Static analysis of the frontend. The TypeScript in ui/ is what renders
# untrusted-ish text (gateway log lines, certificate fingerprints, error
# messages) inside a webview, so it is worth scanning even though it is small.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # required to upload the SARIF results
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          language: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:${{ matrix.language }}
