name: CodeQL

# Static analysis of the frontend. The TypeScript in ui/ is what renders
# untrusted-ish text (gateway log lines, certificate fingerprints, error
# messages) inside a webview, so it is worth scanning even though it is small.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # required to upload the SARIF results
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          language: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: /language:${{ matrix.language }}
