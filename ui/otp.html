<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOFV — FortiToken</title>
    <link rel="icon" href="/mark.png" type="image/png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="otp-page">
    <div class="chrome" data-tauri-drag-region>
      <div class="chrome-brand" data-tauri-drag-region>
        <img class="chrome-mark" src="/mark.png" alt="" width="18" height="18" />
        <span>ONE-TIME CODE</span>
      </div>
      <div class="chrome-drag" data-tauri-drag-region></div>
      <div class="win-ctrl">
        <button type="button" id="win-close" title="Close" aria-label="Close">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" /></svg>
        </button>
      </div>
    </div>
    <div class="sheet otp-sheet">
      <p class="kicker">token</p>
      <h2 id="otp-title">One-time code</h2>
      <p id="otp-lede" class="lede">
        Six digits from your token (60&nbsp;s window). They go into the ephemeral config, never into argv.
      </p>
      <p id="otp-helper" class="banner" hidden>
        Helper missing — Connect stays blocked until <code>./scripts/install.sh</code>.
      </p>
      <input
        id="otp"
        inputmode="numeric"
        maxlength="6"
        pattern="[0-9]{6}"
        autocomplete="one-time-code"
        placeholder="••••••"
        autofocus
      />
      <p id="otp-error" class="hint error" role="alert"></p>
      <div class="actions">
        <button id="otp-go" class="btn primary" type="button">Send</button>
        <button id="otp-cancel" class="btn ghost" type="button">Cancel</button>
      </div>
    </div>
    <script type="module" src="/src/otp.ts"></script>
  </body>
</html>
