[workspace]
resolver = "2"
members = [
    "crates/tofv-core",
    "crates/tofv-scan",
    "crates/pinentry-tofv",
    "crates/tofv-helper",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Altagen/TOFV"
rust-version = "1.80"
# Application crates, not crates.io libraries.
publish = false

[workspace.dependencies]
tofv-core = { path = "crates/tofv-core" }
tofv-scan = { path = "crates/tofv-scan" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1"
zeroize = { version = "1.8", features = ["derive"] }
ctrlc = "3.4"
serde_json = "1.0"
libc = "0.2"
